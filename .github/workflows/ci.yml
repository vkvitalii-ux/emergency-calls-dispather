name: Emergency Dispatcher CI

# Конвейер запускается при любом push-сохранении в ветки main или develop
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код проекта на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. Устанавливаем менеджер зависимостей Poetry (он у вас используется)
      - name: Install Poetry
        run: |
          curl -sSL https://python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # 4. Устанавливаем все библиотеки проекта (включая pytest)
      - name: Install dependencies
        run: poetry install

      # 5. Робот автоматически запускает тесты в облаке
      - name: Run Pytest
        run: poetry run pytest
