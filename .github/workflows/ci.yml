name: Emergency Dispatcher CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код проекта на сервер GitHub
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 3. Устанавливаем менеджер зависимостей Poetry (он у вас используется)
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true

      # 4. Устанавливаем все библиотеки проекта (включая pytest)
      - name: Install dependencies
        run: poetry install --no-interaction

      # 5. Робот автоматически запускает тесты в облаке
      - name: Run Pytest
        run:  |
              poetry run pip install pytest
              poetry run pytest
